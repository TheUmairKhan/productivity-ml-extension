[package]
name = "rust_extractor"
version = "0.1.0"
edition = "2021"

[lib]
name = "rust_extractor"
crate-type = ["cdylib"]

[dependencies]
pyo3       = { version = "0.22", features = ["extension-module"] }
numpy      = "0.22"
ndarray    = "0.16"
rand       = "0.8"
rand_distr = "0.4"
ahash      = "0.8"

[profile.release]
opt-level   = 3
lto         = "thin"
codegen-units = 1
